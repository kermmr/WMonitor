name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (Release)
        run: dotnet build WMonitor.sln -c Release

      - name: Unit tests
        run: dotnet test WMonitor.sln -c Release --no-build

      - name: Headless probes
        shell: pwsh
        env:
          WMONITOR_PROBE_OUT: ${{ github.workspace }}\probe-out
        run: ./scripts/run-probes.ps1

      - name: Publish portable (installer payload)
        run: >
          dotnet publish WMonitor.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o build/portable

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "${env:LocalAppData}\Programs\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = "ISCC.exe" }
          & $iscc installer/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: probe-out/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: build/installer/*.exe
