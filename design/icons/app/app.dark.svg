<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- WMonitor app icon proposal B - gauge, dark theme -->
  <defs>
    <linearGradient id="bD-container" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242931"/>
      <stop offset="1" stop-color="#13161B"/>
    </linearGradient>
    <linearGradient id="bD-glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4CC2FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="bD-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bD-clip"><rect x="52" y="52" width="408" height="408" rx="92"/></clipPath>
    <filter id="bD-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="10" result="o"/><feFlood flood-color="#000000" flood-opacity=".45"/><feComposite in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#bD-shadow)">
    <rect x="52" y="52" width="408" height="408" rx="92" fill="url(#bD-container)"/>
  </g>
  <rect x="53.25" y="53.25" width="405.5" height="405.5" rx="90.75" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="2.5"/>
  <g clip-path="url(#bD-clip)">
    <rect x="52" y="52" width="408" height="220" fill="url(#bD-gloss)"/>
  </g>
  <!-- 270 deg track -->
  <path d="M182.5 339.5 A104 104 0 1 1 329.5 339.5" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="30" stroke-linecap="round"/>
  <!-- 68 percent progress -->
  <path d="M182.5 339.5 A104 104 0 1 1 334 197.2" fill="none" stroke="url(#bD-glyph)" stroke-width="30" stroke-linecap="round"/>
  <!-- needle -->
  <line x1="256" y1="266" x2="296.5" y2="230.3" stroke="#4CC2FF" stroke-width="20" stroke-linecap="round"/>
  <circle cx="256" cy="266" r="24" fill="url(#bD-glyph)"/>
</svg>
