<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- WMonitor app icon proposal A - pulse, light theme -->
  <defs>
    <linearGradient id="aL-container" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFF2F6"/>
    </linearGradient>
    <linearGradient id="aL-glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FA1FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="aL-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="aL-clip"><rect x="52" y="52" width="408" height="408" rx="92"/></clipPath>
    <filter id="aL-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0E1014" flood-opacity=".14"/>
    </filter>
  </defs>
  <g filter="url(#aL-shadow)">
    <rect x="52" y="52" width="408" height="408" rx="92" fill="url(#aL-container)"/>
  </g>
  <rect x="53.25" y="53.25" width="405.5" height="405.5" rx="90.75" fill="none" stroke="rgba(0,0,0,.06)" stroke-width="2.5"/>
  <g clip-path="url(#aL-clip)">
    <rect x="52" y="52" width="408" height="220" fill="url(#aL-gloss)"/>
  </g>
  <!-- sampling track -->
  <line x1="136" y1="276" x2="376" y2="276" stroke="rgba(0,0,0,.10)" stroke-width="28" stroke-linecap="round"/>
  <!-- ecg line -->
  <path d="M136 276 H226 L244 190 L266 342 L282 276 H322" fill="none" stroke="url(#aL-glyph)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- live dot -->
  <circle cx="356" cy="276" r="17" fill="#11A36B"/>
</svg>
